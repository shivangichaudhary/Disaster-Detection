version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Disaster Detection – Full Stack
#   Kafka (+ Zookeeper + UI)  →  Spark (master + worker)  →  Redis  →  Postgres
# ─────────────────────────────────────────────────────────────────────────────

x-spark-common: &spark-common
  image: apache/spark:3.4.1-scala2.12-java11-python3-ubuntu
  user: root  # Need root to install packages or access mounts sometimes
  environment:
    - SPARK_RPC_AUTHENTICATION_ENABLED=no
    - SPARK_RPC_ENCRYPTION_ENABLED=no
    - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
    - SPARK_SSL_ENABLED=no
    - SPARK_USER=spark
  volumes:
    - ./:/app                          # mount project code into containers
    - spark_logs:/opt/spark/logs

services:

  # ── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Broker ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Internal listener (for Spark inside Docker)  +  External (for host Python)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_MESSAGE_MAX_BYTES: 10485760       # 10 MB (for SAR metadata payloads)
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # kafka-ui runs inside the same Docker network → use internal listener
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── Spark Master ──────────────────────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"      # Spark master RPC
      - "8082:8080"      # Spark master Web UI
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Spark Worker ──────────────────────────────────────────────────────────
  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"      # Spark worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - APP_ROOT=/app

  # ── Spark Streaming Job (runs the pipeline automatically) ─────────────────
  spark-streaming:
    <<: *spark-common
    container_name: spark-streaming
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPARK_MODE=client
      - APP_ROOT=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092   # internal broker address
      - SPARK_LOCAL_MODE=false
      - SPARK_CHECKPOINT_DIR=/tmp/spark_checkpoints
      - MODEL_PATH=/app/checkpoints/best_model.pt
      - MIN_TWEET_CREDIBILITY=0.30
      - MAX_BOT_SCORE=0.70
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1,org.postgresql:postgresql:42.6.0
        --conf spark.sql.shuffle.partitions=8
        --conf spark.executor.memory=3g
        --conf spark.driver.memory=2g
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer
        /app/pipeline/spark/streaming_job.py --mode tweet_only
    restart: on-failure
    volumes:
      - ./:/app
      - spark_logs:/opt/spark/logs

  # ── Redis (alert cache + pub/sub for dashboard) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: disaster_db
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster -d disaster_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Inference API (FastAPI – POST /predict, GET /health) ────────────────
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: inference
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"        # FastAPI inference server
    environment:
      MODEL_PATH: /app/checkpoints/best_model.pt
      INFERENCE_DEVICE: cpu
      DATABASE_URL: postgresql://disaster:disaster123@postgres:5432/disaster_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./:/app
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: on-failure

  # ── Dashboard (FastAPI + Leaflet.js GIS map) ──────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"        # Dashboard web UI
    environment:
      DATABASE_URL: postgresql://disaster:disaster123@postgres:5432/disaster_db
      REDIS_URL: redis://redis:6379/0
      INFERENCE_URL: http://inference:8000
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: on-failure

volumes:
  pgdata:
  kafka_data:
  spark_logs:
